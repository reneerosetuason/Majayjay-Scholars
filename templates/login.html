<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MajayjayScholars</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #ede4ff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .wrapper {
            display: flex;
            width: 100%;
            max-width: 900px;
            height: 600px;
            max-height: 90vh;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        /* ✅ Left side: clean white background + centered logo */
        .image-side {
            flex: 2;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .image-side img {
            width: 80%;
            max-width: 300px;
            height: auto;
            object-fit: contain;
        }

        .form-side {
            flex: 3;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
        }

        h2 {
            color: #5b4ac7;
            margin-bottom: 25px;
            font-weight: 700;
            font-size: 1.75rem;
        }

        form {
            width: 100%;
            max-width: 300px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #7a5af5;
        }

        button {
            width: 100%;
            background-color: #7a5af5;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: #6745d1;
        }

        button:active {
            transform: scale(0.99);
        }

        a {
            color: #7a5af5;
            text-decoration: none;
            transition: color 0.3s;
        }

        a:hover {
            color: #5b4ac7;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .wrapper {
                flex-direction: column;
                height: auto;
                width: 95%;
                padding: 0;
            }

            .image-side {
                display: none;
            }

            .form-side {
                flex: 1;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Left Column: Logo -->
        <div class="image-side">
            <img src="{{ url_for('static', filename='assets/majayjay_logo.jpg') }}" alt="Majayjay Logo">
        </div>

        <!-- Right Column: Login Form -->
        <div class="form-side">
            <h2>Login to MajayjayScholars</h2>

            <form method="POST" action="{{ url_for('login') }}">
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>

            <p style="margin-top: 25px; font-size: 0.9rem;">
                Don't have an account? <a href="{{ url_for('register') }}">Register</a>
            </p>
        </div>
    </div>
</body>
</html>
